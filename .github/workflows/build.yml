name: Build MihdTool exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cài Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DPass=${{ secrets.TOOL_PASSWORD }}" setup.iss

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MihdTool-OneClick
          path: output/MihdTool-OneClick.exe

      - name: Đưa lên Release (khi push tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output/MihdTool-OneClick.exe
