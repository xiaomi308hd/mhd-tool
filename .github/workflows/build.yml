name: Build MihdTool exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout (kèm file LFS)
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Kiểm tra file đầu vào
        shell: pwsh
        run: |
          $need = "1.jpg","2.jpg","3.jpg","4.jpg","5.jpg","AdbWinApi.dll","AdbWinUsbApi.dll","adb.exe","ferrari.apk","getout.apk","katniss.apk","keyboard.apk","launcher.apk","MihdTool.exe","MiHDTV.apk","mix.apk","projectivy.plbackup","youtube.apk"
          $miss = $need | Where-Object { -not (Test-Path "XiaomiTool/$_") }
          if ($miss) { throw "Thiếu file: $($miss -join ', ')" }
          # File LFS chưa tải đúng sẽ chỉ nặng vài trăm byte
          $small = Get-ChildItem XiaomiTool -Include *.apk,MihdTool.exe -Recurse | Where-Object { $_.Length -lt 2000 }
          if ($small) { throw "File LFS chưa tải đúng: $($small.Name -join ', ')" }
          Write-Host "Đủ $($need.Count) file."

      - name: Cài Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss
          if (-not (Test-Path output/MihdTool-OneClick.exe)) { throw "Build thất bại" }

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: MihdTool-OneClick
          path: output/MihdTool-OneClick.exe
          compression-level: 0

      - name: Đưa lên Release (khi push tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output/MihdTool-OneClick.exe
